name: Build

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ShiftPlanner.sln

      - name: Build
        run: dotnet build ShiftPlanner.sln --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test src/ShiftPlanner.Tests/ShiftPlanner.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      # issue #75: real integration tests through the ASP.NET Core pipeline (WebApplicationFactory)
      # against a real Postgres. These use Testcontainers.PostgreSql, which starts and tears down
      # its own throwaway Postgres container per run via the Docker daemon GitHub's hosted
      # ubuntu-latest runners already have running — no `services:` Postgres container needed
      # (and adding one would just sit unused, since Testcontainers manages its own container
      # lifecycle rather than connecting to a fixed one).
      - name: Integration tests
        run: dotnet test src/ShiftPlanner.IntegrationTests/ShiftPlanner.IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build
