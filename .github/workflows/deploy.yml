name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

# One deploy at a time: back-to-back merges otherwise build images on the VPS in parallel,
# starving it until SSH drops (exit 255 on #167-169, #179, #180). A running deploy is never
# cancelled; a newer queued one replaces an older queued one, so the latest main still deploys.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # deploy.sh pulls the latest main before bumping the version

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SHIFTPLANNER_DEPLOY_SSH_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H vi0lins.de >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          SHIFTPLANNER_DEPLOY_HOST: ${{ secrets.SHIFTPLANNER_DEPLOY_HOST }}
          SHIFTPLANNER_DEPLOY_PATH: ${{ secrets.SHIFTPLANNER_DEPLOY_PATH }}
        run: ./deploy/deploy.sh
